<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashton Hughes | Digital Portfolio</title>
    <style>
        /* Color scheme updated to match the image provided */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #84ac73; /* Bottom background green from photo */
            color: #333;
        }

        header {
            background-color: #559551; /* Main header green from photo */
            padding: 40px 20px;
            text-align: center;
        }

        /* The specific border box from your photo */
.header-border-box {
    border: 3px ridge #ffffff;
    border-radius: 25px;
    display: inline-block;
    padding: 30px 150px;
    
    /* Add these lines below */
    background-image: url('images/me.png'); /* Change this to your filename */
    background-size: cover;                       /* Makes the image fit the box */
    background-position: center;                  /* Centers the image */
}

        header h1 {
            color: white;
            margin: 0;
            font-size: 2.5rem;
        }

        header p {
            color: white;
            margin: 10px 0 0 0;
            font-weight: 500;
        }

        /* Navigation Bar matching the lighter green strip in photo */
        nav {
            background-color: #70c167; 
            padding: 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 12px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        nav a:hover {
            color: #1b3022;
        }

        /* Main Content Container */
        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-height: 400px;
        }

        h2 {
            color: #4a5d4a;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .audio-player {
            background: #f1f4f0;
            padding: 1px;
            border-radius: 10px;
            text-align: center;
            margin-top: 30px;
            border: 1px solid #cedbce;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: white;
            font-size: 0.9rem;
        }

    #overlay {
  position: fixed; /* Sit on top of the page content */
  display: none; /* Hidden by default */
  width: 100%; /* Full width (cover the whole page) */
  height: 100%; /* Full height (cover the whole page) */
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(201, 49, 49, 0.5); /* Black background with opacity */
  z-index: 2; /* Specify a stack order in case you're using a different order for other elements */
  cursor: pointer; /* Add a pointer on hover */
}

    </style>
</head>
<body>

    <header>
        <div id="#overlay" class="header-border-box">
            <h1>Ashton<br>Hughes</h1>
            <p>IT Student | Technical Portfolio</p>
        </div>
    </header>

    <nav>
        <a href="index.html">Homepage</a>
        <a href="about.html">About Me</a>
        <a href="qualifications.html" style="background-color: #224d20; color: white; border-radius: 10px; padding: 5px;" >Qualifications</a>
        <a href="skills.html">Skills</a>
        <a href="employment.html">Employment</a>
        <a href="hobbies.html">Gallery</a>
    </nav>

    <div class="container">
        
        <section id="about">
            <h2>My Qualifications</h2>
            <p></p>
        </section>


        <section class="audio-player">
            <h3>Audio Introduction</h3>
            <audio controls>
                <source src="intro.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>

    </div>

    <footer>
        <p>&copy; 2026 Ashton Hughes | Level 2 IT Coursework</p>
    </footer>

</body>
</html>
