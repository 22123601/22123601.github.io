<!DOCTYPE html>
<html>
<head>
    <title>Mobile World Station - Contact</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #5e4b6b;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 950px;
            margin: 0 auto;
        }

        .banner-img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }

        nav {
            background-color: #fce4ec;
            padding: 10px;
            border: 2px solid #ff8fb7;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        nav a {
            text-decoration: none;
            color: #43334c;
            padding: 10px 15px;
            font-weight: bold;
            display: inline-block;
        }

        nav a:hover {
            background-color: #ff8fb7;
            color: white;
            border-radius: 5px;
        }

        h1 { 
            color: #ffffff; 
            text-align: center; 
            margin-top: 20px; 
            font-weight: normal;
        }

        .contact-box {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 30px;
            max-width: 850px;
            margin: 20px auto;
            border: 1px solid #ddd;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .col {
            flex: 1;
        }

        .form-control {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-family: Arial, sans-serif;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: #ff8fb7;
            box-shadow: 0 0 5px rgba(255, 143, 183, 0.5);
        }

        textarea.form-control {
            margin-bottom: 20px;
            resize: vertical;
        }

        .btn-block {
            width: 100%;
            padding: 15px;
            background-color: #ff8fb7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-block:hover {
            background-color: #43334c;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #ead1dc;
            margin-top: 30px;
            font-size: 14px;
        }
		
		p  {
		color: #ead1dc;
		}
    </style>
</head>
<body>
<div class="container">
    
    <img src="images/banner.png" alt="Mobile World Station Banner" class="banner-img">

    <nav>
        <a href="index.htm">Homepage</a>
        <a href="accessories.htm">Accessories</a>
        <a href="iphone.htm">iPhone</a>
        <a href="samsung.htm">Samsung</a>
        <a href="google.html">Google</a>
        <a href="other.htm">Other Phones</a>
        <a href="services.htm">Services</a>
        <a href="contact.htm" style="background-color: #ff8fb7; color: white; border-radius: 5px;">Contact</a>
    </nav>

    <h1>Contact Us!</h1>

    
  
		
		<div class="contact-box">
		<form action="mailto:22123601@cambria.ac.uk" method="post" enctype="text/plain" >
		
        <label for="name">Name:</label><br>
        <input type="text"  class="form-control"  id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" class="form-control"  id="email" name="email" required><br><br>

        <label for="comments">Comments:</label><br>
        <textarea id="comments" class="form-control"  name="comments" rows="4" cols="50" required></textarea><br><br>
		
		 </div>
        <input type="submit" value="Submit"  class="btn-block">
    </form>
		
		
		
		
    </div>

    <footer>
        Made by Ashton Hughes
    </footer>
</div>
</body>
</html>
