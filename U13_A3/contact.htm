<!DOCTYPE html>
<html>
<head>
    <title>Mobile World Station - Contact</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #5e4b6b;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 950px;
            margin: 0 auto;
        }

        .banner-img {
            width: 100%;
            border-radius: 10px;
            display: block;
        }

        nav {
            background-color: #fce4ec;
            padding: 10px;
            border: 2px solid #ff8fb7;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        nav a {
            text-decoration: none;
            color: #43334c;
            padding: 10px 15px;
            font-weight: bold;
            display: inline-block;
        }

        nav a:hover {
            background-color: #ff8fb7;
            color: white;
            border-radius: 5px;
        }

        h1 { 
            color: #ffffff; 
            text-align: center; 
            margin-top: 20px; 
            font-weight: normal;
        }

        .contact-box {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 30px;
            max-width: 850px;
            margin: 20px auto;
            border: 1px solid #ddd;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .col {
            flex: 1;
        }

        .form-control {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-family: Arial, sans-serif;
            font-size: 14px;
            outline: none;
        }

        .form-control:focus {
            border-color: #ff8fb7;
            box-shadow: 0 0 5px rgba(255, 143, 183, 0.5);
        }

        textarea.form-control {
            margin-bottom: 20px;
            resize: vertical;
        }

        .btn-block {
            width: 100%;
            padding: 15px;
            background-color: #ff8fb7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-block:hover {
            background-color: #43334c;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #ead1dc;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
    
    <img src="images/banner.png" alt="Mobile World Station Banner" class="banner-img">

    <nav>
        <a href="index.htm">Homepage</a>
        <a href="accessories.htm">Accessories</a>
        <a href="iphone.htm">iPhone</a>
        <a href="samsung.htm">Samsung</a>
        <a href="google.html">Google</a>
        <a href="other.htm">Other Phones</a>
        <a href="services.htm">Services</a>
        <a href="contact.htm" style="background-color: #ff8fb7; color: white; border-radius: 5px;">Contact</a>
    </nav>

    <h1>Contact Us!</h1>

    <div class="contact-box">
        <form target="_blank" action="https://formsubmit.com/gashhughes@gmail.com" method="POST">
            <div class="form-row">
                <div class="col">
                    <input type="text" name="name" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="col">
                    <input type="email" name="email" class="form-control" placeholder="Email Address" required>
                </div>
            </div>
            
            <div class="form-group">
                <textarea placeholder="How can we help you today?" class="form-control" name="message" rows="8" required></textarea>
            </div>
            
            <button type="submit" class="btn-block">Send Message</button>
        </form>
    </div>

    <footer>
        Made by Ashton Hughes
    </footer>
</div>
</body>
</html>
